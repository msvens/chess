name: Integration (live APIs)

# Live contract tests against the SSF and ChessTools APIs. Kept out of the PR
# gate (ci.yml) so a flaky upstream can't block merges; run here on a schedule +
# on demand instead. The suite self-skips when a host is unreachable (see
# src/lib/api/__tests__/helpers/liveProbe.ts), so a down host shows as
# passed-with-skips, and only genuine upstream drift fails the run.
#
# What it guards: the trailing-slash behaviour and the CORS-preflight rejection
# that the nginx/Vite proxy configuration is built around. Those are assumptions
# about someone else's server, so they need watching, not just documenting.
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of truth, and action-setup errors out if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Live upstream contract tests
        run: pnpm test:integration
