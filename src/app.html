<!doctype html>
<html lang="sv">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Set the theme before first paint to avoid a flash. Mirrors theme.svelte.ts,
			// and deliberately preserves the Next app's behaviour: an explicit choice in
			// localStorage wins, otherwise DARK. This app does not follow the OS setting —
			// changing that would be a product decision, not a migration side effect.
			try {
				var t = localStorage.getItem('theme');
				document.documentElement.classList.toggle('dark', t !== 'light');
			} catch (e) {
				/* localStorage unavailable — fall through to the dark default below. */
				document.documentElement.classList.add('dark');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
